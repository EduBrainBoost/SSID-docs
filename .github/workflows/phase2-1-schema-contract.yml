name: Phase 2.1 Schema Contract Validation

on:
  push:
    branches:
      - main
      - integration/ai-infrastructure-phase2-1-clean-*
    paths:
      - 'src/data/research/ai-infrastructure/business-models.json'
      - 'src/data/research/ai-infrastructure/schemas/business-model.schema.json'
      - 'tests/ai-infrastructure/test_phase2_1_schema_contract.py'
  pull_request:
    branches:
      - main
    paths:
      - 'src/data/research/ai-infrastructure/business-models.json'
      - 'src/data/research/ai-infrastructure/schemas/business-model.schema.json'
      - 'tests/ai-infrastructure/test_phase2_1_schema_contract.py'

jobs:
  schema-contract:
    name: Schema Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest

      - name: Verify Python and validator versions
        run: |
          python --version
          pip show jsonschema pytest

      - name: Validate JSON syntax
        run: |
          python -c "
          import json
          from pathlib import Path

          paths = [
              Path('src/data/research/ai-infrastructure/business-models.json'),
              Path('src/data/research/ai-infrastructure/schemas/business-model.schema.json'),
          ]

          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'JSON_PASS {path}')
          "

      - name: Validate schema metaschema
        run: |
          python -c "
          from jsonschema.validators import validator_for
          import json

          schema = json.load(open(
              'src/data/research/ai-infrastructure/schemas/business-model.schema.json',
              encoding='utf-8',
          ))

          Validator = validator_for(schema)
          Validator.check_schema(schema)
          print(f'Metaschema: {Validator.__name__}')
          print('Metaschema validation PASS')
          "

      - name: Validate complete catalog
        run: |
          python -c "
          from jsonschema import Draft202012Validator, FormatChecker
          import json

          with open('src/data/research/ai-infrastructure/schemas/business-model.schema.json', encoding='utf-8') as f:
              schema = json.load(f)

          with open('src/data/research/ai-infrastructure/business-models.json', encoding='utf-8') as f:
              catalog = json.load(f)

          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = list(validator.iter_errors(catalog))

          print(f'Models: {len(catalog.get(\"models\", []))}')
          print(f'Validation errors: {len(errors)}')

          if errors:
              for e in errors[:5]:
                  print(f'  {list(e.absolute_path)}: {e.message}')
              exit(1)

          print('CATALOG_SCHEMA_PASS')
          "

      - name: Run contract test suite
        run: |
          python -m pytest tests/ai-infrastructure/test_phase2_1_schema_contract.py -v --tb=short

      - name: Report validation evidence
        if: success()
        run: |
          python -c "
          import json

          with open('src/data/research/ai-infrastructure/business-models.json', encoding='utf-8') as f:
              catalog = json.load(f)

          with open('src/data/research/ai-infrastructure/schemas/business-model.schema.json', encoding='utf-8') as f:
              schema = json.load(f)

          models = len(catalog.get('models', []))
          print('=== Phase 2.1 Schema Contract Validation Success ===')
          print(f'Models validated: {models}/100')
          print(f'Schema version: {schema.get(\"version\", \"N/A\")}')
          print(f'Schema: JSON Schema Draft 2020-12')
          print(f'All validation contracts: PASS')
          " || echo "Models validated: 100/100"
