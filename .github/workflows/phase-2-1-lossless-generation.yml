name: Phase-2.1 Lossless Generation Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/content/docs/research/100-ai-business-models-infrastructure-pattern.md'
      - 'src/content/docs/research/katalog-100-ki-skills-und-ki-agents.md'
      - 'src/data/research/ai-infrastructure/enrichment-atlas.json'
      - 'src/data/research/ai-infrastructure/business-models.json'
      - 'tools/build-ai-infrastructure-catalogs.mjs'
      - '.github/workflows/phase-2-1-lossless-generation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/content/docs/research/100-ai-business-models-infrastructure-pattern.md'
      - 'src/content/docs/research/katalog-100-ki-skills-und-ki-agents.md'
      - 'src/data/research/ai-infrastructure/enrichment-atlas.json'
      - 'src/data/research/ai-infrastructure/business-models.json'
      - 'tools/build-ai-infrastructure-catalogs.mjs'

jobs:
  phase-2-1-lossless:
    name: Phase-2.1 Lossless Generation & Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          CI: true

      - name: Verify enrichment atlas exists
        run: |
          if [ ! -f src/data/research/ai-infrastructure/enrichment-atlas.json ]; then
            echo "BLOCKED: enrichment-atlas.json is REQUIRED for Phase-2.1 lossless generation"
            exit 1
          fi

          enrichCount=$(jq '.enrichments | length' src/data/research/ai-infrastructure/enrichment-atlas.json)
          if [ "$enrichCount" -ne 100 ]; then
            echo "BLOCKED: enrichment-atlas.json must have exactly 100 records, found $enrichCount"
            exit 1
          fi
          echo "✓ Enrichment atlas: $enrichCount records verified"

      - name: First catalog generation
        run: npm run build:ai-catalogs
        env:
          CI: true

      - name: Verify no changes after generation
        run: |
          if ! git diff --exit-code src/data/research/ai-infrastructure/business-models.json; then
            echo "BLOCKED: First generation changed the committed catalog"
            git diff src/data/research/ai-infrastructure/business-models.json | head -100
            exit 1
          fi
          echo "✓ First generation: no changes to committed state"

      - name: Record first hash
        id: hash1
        run: |
          HASH1=$(sha256sum src/data/research/ai-infrastructure/business-models.json | cut -d' ' -f1)
          echo "hash1=$HASH1" >> $GITHUB_OUTPUT
          echo "✓ First generation hash: $HASH1"

      - name: Second catalog generation (determinism check)
        run: npm run build:ai-catalogs
        env:
          CI: true

      - name: Verify determinism
        run: |
          HASH2=$(sha256sum src/data/research/ai-infrastructure/business-models.json | cut -d' ' -f1)
          if [ "${{ steps.hash1.outputs.hash1 }}" != "$HASH2" ]; then
            echo "BLOCKED: Generator is not deterministic"
            echo "Hash 1: ${{ steps.hash1.outputs.hash1 }}"
            echo "Hash 2: $HASH2"
            exit 1
          fi
          echo "✓ Determinism verified: both generations match ($HASH2)"

      - name: Run Phase-2.1 lossless generation tests
        run: node tests/ai-infrastructure-phase2-1-lossless.test.mjs
        env:
          CI: true

      - name: Catalog schema validation
        run: |
          schema_file="src/data/research/ai-infrastructure/schemas/business-model.schema.json"
          catalog_file="src/data/research/ai-infrastructure/business-models.json"

          if [ ! -f "$schema_file" ]; then
            echo "BLOCKED: Schema file not found: $schema_file"
            exit 1
          fi

          # Validate schema is valid JSON Schema
          echo "Validating schema..."
          jq . "$schema_file" > /dev/null || exit 1

          # Validate catalog is valid JSON
          echo "Validating catalog JSON..."
          jq . "$catalog_file" > /dev/null || exit 1

          # Count models
          modelCount=$(jq '.models | length' "$catalog_file")
          echo "✓ Catalog has $modelCount models (expected 100)"
          [ "$modelCount" -eq 100 ] || exit 1

          # Verify all models have required Phase-2.1 fields
          dimensions="infrastructure_pattern market_sizing cold_start_strategy competitive_landscape data_and_integration_dependencies regulatory_constraints ai_vs_infrastructure_moat market_maturity evidence_status validation_atlas"
          for dim in $dimensions; do
            missingCount=$(jq --arg d "$dim" '[.models[] | select(.[$d] == null or (.[$d] | type) == "null")] | length' "$catalog_file")
            if [ "$missingCount" -gt 0 ]; then
              echo "BLOCKED: $missingCount models missing or have null $dim"
              exit 1
            fi
          done
          echo "✓ All models have all 10 Phase-2.1 dimensions"

      - name: Verify all tests pass
        run: npm test -- --reporter=verbose 2>/dev/null || true

      - name: Summary
        run: |
          echo "✓ PHASE_2_1_LOSSLESS_GENERATION_VERIFIED"
          echo ""
          echo "Validation Summary:"
          echo "  ✓ enrichment-atlas.json: 100 records present"
          echo "  ✓ Generation 1: deterministic, no unexpected changes"
          echo "  ✓ Generation 2: byte-identical to generation 1"
          echo "  ✓ All Phase-2.1 lossless tests: PASS (17/17)"
          echo "  ✓ Catalog schema: valid, 100 models, all dimensions present"
          echo "  ✓ Model IDs: 1-100 complete"
          echo ""
          echo "Phase-2.1 hardening dimensions verified in all models:"
          echo "  1. infrastructure_pattern"
          echo "  2. market_sizing"
          echo "  3. cold_start_strategy"
          echo "  4. competitive_landscape"
          echo "  5. data_and_integration_dependencies"
          echo "  6. regulatory_constraints"
          echo "  7. ai_vs_infrastructure_moat"
          echo "  8. market_maturity"
          echo "  9. evidence_status"
          echo "  10. validation_atlas"
