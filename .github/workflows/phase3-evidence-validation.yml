name: phase3-evidence-validation

on:
  pull_request:
    paths:
      - 'src/data/research/ai-infrastructure/phase3/**'
      - 'tools/ai-infrastructure/phase3/**'
      - 'tests/ai-infrastructure/phase3/**'
      - '.github/workflows/phase3-evidence-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/research/ai-infrastructure/phase3/**'
      - 'tools/ai-infrastructure/phase3/**'
      - 'tests/ai-infrastructure/phase3/**'
      - '.github/workflows/phase3-evidence-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run Phase-3 validator with explicit path
        run: python tools/ai-infrastructure/phase3/validate_phase3.py src/data/research/ai-infrastructure/phase3
        continue-on-error: false

      - name: Run Phase-3 tests (fail-closed)
        run: python -m pytest tests/ai-infrastructure/phase3/test_phase3_evidence.py -v --tb=short

      - name: Verify protected files unchanged (base to head)
        run: |
          BASE_SHA=$(git rev-parse origin/${{ github.base_ref || 'main' }})
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Comparing base SHA=$BASE_SHA to head SHA=$HEAD_SHA"
          git diff --exit-code "$BASE_SHA..HEAD" -- src/data/research/ai-infrastructure/business-models.json || exit 1
          git diff --exit-code "$BASE_SHA..HEAD" -- src/data/research/ai-infrastructure/schemas/business-model.schema.json || exit 1
          git diff --exit-code "$BASE_SHA..HEAD" -- src/data/research/ai-infrastructure/enrichment-atlas.json || exit 1
          echo "✓ Protected files unchanged"

      - name: Structured path hygiene scan
        run: |
          FAIL=0
          # Scan actual data values (JSON) but exclude test patterns
          for file in src/data/research/ai-infrastructure/phase3/*.json; do
            if grep -E 'C:\\Users\\|/home/|/Users/|/root/' "$file" 2>/dev/null; then
              echo "❌ Personal path in $file"
              FAIL=1
            fi
          done

          # Exclude test definitions when checking Markdown
          for file in src/data/research/ai-infrastructure/phase3/*.md; do
            if grep -E 'C:\\Users\\|/home/|/Users/|/root/' "$file" 2>/dev/null | grep -v 'test\|pattern\|example\|documentation'; then
              echo "❌ Personal path in $file"
              FAIL=1
            fi
          done

          if [ $FAIL -eq 0 ]; then
            echo "✓ Path hygiene check passed"
          fi
          exit $FAIL

      - name: Credential-shaped security scan
        run: |
          FAIL=0
          # Only look for realistic credential patterns
          for file in src/data/research/ai-infrastructure/phase3/*.json; do
            if grep -E 'AKIA[0-9A-Z]{16}|password["\s:=]+[a-zA-Z0-9]{8,}|api.key["\s:=]+[a-zA-Z0-9_]{16,}' "$file" 2>/dev/null; then
              echo "❌ Credential pattern in $file"
              FAIL=1
            fi
          done

          if [ $FAIL -eq 0 ]; then
            echo "✓ Security scan passed (no credential patterns)"
          fi
          exit $FAIL

      - name: Validate artifact inventory (exactly 11 files)
        run: |
          EXPECTED_FILES=(
            "phase3-claim-inventory.json"
            "phase3-source-manifest.json"
            "phase3-evidence-taxonomy.json"
            "phase3-known-defect-repairs.json"
            "phase3-test-results.json"
            "phase3-repository-scope-audit.json"
            "PHASE_3_AUDIT_CLOSURE_SUMMARY.md"
            "PHASE_3_EXECUTION_SUMMARY.md"
            "phase3-research-execution-framework.json"
            "phase3-human-research-backlog.json"
            "phase3-validation-atlas.json"
          )

          MISSING=0
          EXTRA=0

          for file in "${EXPECTED_FILES[@]}"; do
            if [ ! -f "src/data/research/ai-infrastructure/phase3/$file" ]; then
              echo "❌ Missing: $file"
              MISSING=$((MISSING + 1))
            fi
          done

          ACTUAL_COUNT=$(ls -1 src/data/research/ai-infrastructure/phase3/ | wc -l)
          EXPECTED_COUNT=${#EXPECTED_FILES[@]}

          if [ $ACTUAL_COUNT -ne $EXPECTED_COUNT ]; then
            echo "❌ File count mismatch: expected $EXPECTED_COUNT, found $ACTUAL_COUNT"
            exit 1
          fi

          if [ $MISSING -gt 0 ]; then
            echo "❌ FAIL: $MISSING required files missing"
            exit 1
          fi
          echo "✓ All 11 Phase-3 artifacts present and accounted for"
